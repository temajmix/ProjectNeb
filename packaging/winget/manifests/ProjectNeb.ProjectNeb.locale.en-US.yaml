ShortDescription: Windows 11 desktop dashboard with a panel, dock, launcher and live wallpapers.
Description: |-
  ProjectNeb is a Windows 11 desktop dashboard: a top panel, a dock, an
  application launcher, a command palette and animated live wallpapers, built in
  Rust with a WebView2 dashboard.

  It is a local-first beta. Settings and logs live in %LocalAppData%\ProjectNeb;
  the optional Discord Rich Presence, Windhawk and network-tuning modules are
  off by default and only run when the user enables them. No telemetry is sent
  by the client.
