[package]
name = "neb-updater"
description = "Applies a staged ProjectNeb update after the supervisor and its children have exited"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "neb_updater"
path = "src/lib.rs"

[[bin]]
name = "neb-updater"
path = "src/main.rs"

[dependencies]
neb-core = { path = "../neb-core" }
thiserror = { workspace = true }
windows = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
