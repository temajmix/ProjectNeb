[package]
name = "neb-core"
description = "Config, logging and process plumbing shared by every ProjectNeb process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Signs test entitlements with a known seed. Enabled by test targets only; never by a release build.
test-support = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
windows = { workspace = true, features = [
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
