[workspace]
resolver = "3"
members = [
    "crates/neb-app",
    "crates/neb-core",
    "crates/neb-cli",
    "crates/neb-shell",
    "crates/neb-supervisor",
    "crates/neb-discord",
    "crates/neb-updater",
    "crates/neb-wallpaper",
    "crates/neb-wm",
    "crates/neb-zapret",
    "crates/neb-windhawk",
]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2.0"
tempfile = "3.14"
windows-numerics = "0.3"
zip = { version = "7.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Win32 only, one feature list shared by every crate that talks to the OS, so the surface is
# auditable in a single place.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

# Deny every warning for every target: the build is the first review pass.
[workspace.lints.rust]
warnings = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "deny"

# `neb-app` names `webview2-com-sys` as a build-dependency only to order its build script before
# ours, which copies `WebView2Loader.dll` out of that script's output. Nothing calls the crate, so
# the manifest lint would warn on a dependency that is doing real work.
[workspace.lints.cargo]
unused_dependencies = "allow"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

