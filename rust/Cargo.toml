[workspace]
resolver = "3"
members = [
    "crates/neb-core",
    "crates/neb-cli",
    "crates/neb-shell",
    "crates/neb-supervisor",
    "crates/neb-wallpaper",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
tempfile = "3.14"
windows-numerics = "0.3"

# Win32 only, one feature list shared by every crate that talks to the OS, so the surface is
# auditable in a single place.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# Deny every warning for every target: the build is the first review pass.
[workspace.lints.rust]
warnings = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "deny"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
